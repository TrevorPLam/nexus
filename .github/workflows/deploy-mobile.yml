name: Deploy Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/ui/**'
      - 'packages/contracts/**'
      - 'packages/mobile-data/**'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

permissions:
  contents: read

jobs:
  build-preview:
    name: Build Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive --no-wait

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive --no-wait

  build-production:
    name: Build Production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS production
        id: ios-build
        run: |
          BUILD_ID=$(eas build --platform ios --profile production --non-interactive --json | jq -r '.id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Build Android production
        id: android-build
        run: |
          BUILD_ID=$(eas build --platform android --profile production --non-interactive --json | jq -r '.id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Submit to TestFlight
        run: |
          eas submit --platform ios --id ${{ steps.ios-build.outputs.build_id }} --non-interactive

      - name: Submit to Play Store
        run: |
          eas submit --platform android --id ${{ steps.android-build.outputs.build_id }} --non-interactive
