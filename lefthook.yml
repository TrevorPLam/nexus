pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,md,yaml,yml}'
      run: pnpm format {staged_files}
      stage_fixed: true
      timeout: 30s

    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm lint {staged_files}
      timeout: 45s

commit-msg:
  commands:
    lint-commit:
      run: pnpm dlx commitlint --edit {1}
