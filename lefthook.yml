pre-commit:
  parallel: false
  skip:
    - merge
    - rebase
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,md,yaml,yml}'
      run: pnpm format {staged_files}
      stage_fixed: true
      timeout: 30s

    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm lint {staged_files}
      timeout: 45s

    lint:md:
      glob: '*.md'
      run: pnpm lint:md {staged_files}
      timeout: 20s

    # Spell check markdown files using cspell
    # Uses cspell from devDependencies with custom dictionaries in .cspell/
    spellcheck:
      glob: '*.{md,mdx}'
      run: pnpm spellcheck {staged_files}
      timeout: 60s

commit-msg:
  commands:
    # Validate commit messages follow conventional commit format
    # Uses @commitlint/cli and @commitlint/config-conventional from devDependencies
    lint-commit:
      run: pnpm dlx commitlint --edit {1}

    spellcheck-commit:
      run: pnpm dlx cspell --no-progress --no-summary --language-id commit-msg {1}
      timeout: 30s
