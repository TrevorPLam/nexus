pre-commit:
  parallel: false
  skip:
    - merge
    - rebase
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,md,yaml,yml}'
      run: pnpm format {staged_files}
      stage_fixed: true
      timeout: 30s

    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm lint {staged_files}
      timeout: 45s

commit-msg:
  commands:
    lint-commit:
      run: commitlint --edit {1}

    spellcheck-commit:
      run: cspell --no-progress --no-summary --language-id commit-msg {1}
      timeout: 30s
